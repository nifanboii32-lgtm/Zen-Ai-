    <meta charset="UTF-8" />

      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('zen-ai-theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-teal-400/30 selection:text-teal-950 dark:selection:text-teal-50">

  </body>
